name: Android verification

on:
  push:
    branches: [main, arena/386b3fb9-jaboard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, tests, and lint
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify hosted Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Run unit tests, lint, and build the debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaBoard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
