name: Android verification

on:
  push:
    branches: [main, arena/386b3fb9-jaboard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, tests, and lint
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify hosted Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Run unit tests, lint, and build the debug APK
        id: android-build
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug > build.log 2>&1
          result=$?
          cat build.log
          exit "$result"
      - name: Surface Gradle failure details
        if: failure() && steps.android-build.outcome == 'failure'
        run: |
          snippet="$(tail -n 35 build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
          echo "::error title=Gradle build output::${snippet}"
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaBoard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
